services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contextbudget
      POSTGRES_USER: contextbudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - contextbudget-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextbudget -d contextbudget"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: src/ContextBudget.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=contextbudget;Username=contextbudget;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      Database__ApplyMigrationsOnStartup: "true"
      Providers__OpenAICompatible__ApiKey: ${Providers__OpenAICompatible__ApiKey:-}
      Providers__OpenAICompatible__Model: ${Providers__OpenAICompatible__Model:-deepseek-v4.1-flash}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
volumes:
  contextbudget-postgres:
